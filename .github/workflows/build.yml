name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Та же версия Ruby, что у GitHub Pages: https://pages.github.com/versions.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true

      - name: Check posts front matter
        id: posts
        run: ruby .github/scripts/check-posts.rb

      - name: Build site
        id: build
        if: ${{ !cancelled() }}
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      # Внешние ссылки не проверяются: сторонние сайты недоступны нестабильно.
      # http:// разрешён для примеров в статьях (openam.example.org и т.п.),
      # ссылки без href — неактивные кнопки пагинации блога.
      - name: Check links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          gem install html-proofer -v '~> 5.0' --no-document
          htmlproofer _site \
            --disable-external \
            --no-enforce-https \
            --allow-missing-href \
            --swap-urls '^https\://www\.3a-systems\.ru:'
